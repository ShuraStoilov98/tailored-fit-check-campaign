name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Check frontend syntax
        run: |
          node --check static/app.js
          node --check static/result.js

  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked in git — remove it and rotate any exposed keys."
            exit 1
          fi
          echo "No tracked .env file."

      - name: Scan tracked files for credential patterns
        run: |
          pattern='sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|AKIA[A-Z0-9]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -nIE "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Possible credential committed."
            exit 1
          fi
          echo "No credential patterns found."
